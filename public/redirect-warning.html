<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heads up — ConnectDots</title>
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body style="margin:0;background:#101315;color:#f3f0e8;font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
    <main style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;max-width:640px;margin:0 auto;">
      <div style="display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid rgba(255,118,89,0.35);border-radius:12px;background:rgba(255,118,89,0.10);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#ff7659;text-transform:uppercase;">
        ⚠ linking out
      </div>
      <h1 style="margin:0;font-size:clamp(1.9rem,5vw,3.2rem);letter-spacing:-.04em;line-height:1.1;">
        This short link opens<br /><span id="dest" style="color:#98a09e;word-break:break-all;">an external page</span>
      </h1>
      <p style="max-width:52ch;color:#98a09e;margin:0;">
        ConnectDots scans every destination, but links can lead anywhere at any time.
        Look at the address below before you continue &mdash; only proceed if it&rsquo;s the
        site you expect.
      </p>
      <div id="dest-url" style="width:100%;max-width:560px;margin-top:16px;padding:14px 18px;background:#171b1d;border:1px solid rgba(243,240,232,0.14);border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#e6ff72;word-break:break-all;">
        resolving…
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:22px;">
        <a id="continue" rel="noopener" style="pointer-events:none;text-decoration:none;opacity:.45;">
          <span style="display:inline-block;padding:14px 26px;background:#ff7659;color:#101315;border-radius:10px;font-weight:700;">Continue to destination →</span>
        </a>
        <button type="button" onclick="history.back()" style="padding:14px 26px;background:transparent;border:1px solid rgba(243,240,232,0.3);color:#f3f0e8;border-radius:10px;font-weight:700;cursor:pointer;">
          ← Go back safely
        </button>
      </div>
      <p id="hint" style="margin-top:18px;font-size:12px;color:#6b7371;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
        verifying destination…
      </p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var qs = new URLSearchParams();
        ["type", "code", "username"].forEach(function (k) {
          var v = params.get(k);
          if (v) qs.set(k, v);
        });

        var dest = document.getElementById("dest");
        var destUrl = document.getElementById("dest-url");
        var link = document.getElementById("continue");
        var hint = document.getElementById("hint");

        var enable = function (realUrl) {
          dest.textContent = "an external page within connectdots";
          if (realUrl && /^https?:\/\//i.test(realUrl)) {
            dest.textContent = realUrl.split("/")[2] || realUrl;
            destUrl.textContent = realUrl;
            link.setAttribute("href", realUrl);
            link.style.pointerEvents = "auto";
            link.style.opacity = "1";
            hint.textContent = "destination confirmed — safe to proceed";
          } else {
            destUrl.textContent = "unavailable";
            hint.textContent = "couldn’t resolve this link — it may have expired";
          }
        };

        if (/^#/.test(window.location.hash)) {
          // Callback/reset links carry a hash fragment; keep it as-is.
          enable(null);
          return;
        }

        fetch("/redirect-warning/data?" + qs.toString(), {
          credentials: "same-origin",
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            enable(d && d.realUrl ? d.realUrl : null);
          })
          .catch(function () {
            enable(null);
          });
      })();
    </script>
  </body>
</html>
